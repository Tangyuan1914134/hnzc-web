name: Apply HNZC website redesign

on:
  push:
    branches:
      - agent-hnzc-redesign-deploy
    paths:
      - .redesign/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment payload
        uses: actions/checkout@v4

      - name: Publish clean website commit
        env:
          BASE_SHA: 39851c10dc179a559c694f7850f04579592c88d0
          ARCHIVE_SHA256: b5079d43470a794483a617e606fc0b250841a11b5394f5a461f2a0ea8fd5432b
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "main changed during deployment; refusing to overwrite it"
            exit 1
          fi

          cat .redesign/chunk-* > /tmp/hnzc-site.tar.xz.b64
          base64 --decode /tmp/hnzc-site.tar.xz.b64 > /tmp/hnzc-site.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/hnzc-site.tar.xz" | sha256sum --check --status

          rm -rf /tmp/hnzc-site
          mkdir -p /tmp/hnzc-site
          tar -xJf /tmp/hnzc-site.tar.xz -C /tmp/hnzc-site
          test -f /tmp/hnzc-site/index.html
          test -f /tmp/hnzc-site/assets/css/style.css
          test -f /tmp/hnzc-site/assets/js/main.js

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/hnzc-site/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n' '重构全站视觉与交互体验' | git commit-tree "$tree_sha" -p "$BASE_SHA")"
          git push origin "$commit_sha:refs/heads/main"

          git push origin --delete "$GITHUB_REF_NAME" || true
